name: Bug report
description: Report a key that still triggers another mod, a crash, or other unexpected behavior.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue.
        Before reporting, make sure the jar is in the instance's `mods` folder and the game was fully restarted.

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge
    attributes:
      label: NeoForge version
      placeholder: "21.1.262"
    validations:
      required: true

  - type: input
    id: aeronautics
    attributes:
      label: Create: Aeronautics / Simulated version
      placeholder: "1.3.2"
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Every Key a Gem version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
      placeholder: "I bound key X to a frequency. Pressing it while the typewriter is active opened mod Y's screen instead of sending the signal."
    validations:
      required: true

  - type: input
    id: conflicting
    attributes:
      label: Conflicting mod and key (if any)
      placeholder: "Mod name + key, e.g. 'Some Backpack Mod — B'"

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Attach or paste `logs/latest.log` (and `crash-reports/` if the game crashed).
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I restarted the game after installing the mod.
          required: true
        - label: I am using Minecraft 1.21.1 / NeoForge 21.1.228+ / Create: Aeronautics 1.3.2+.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
