[[mods]]
modId = "every_key_a_gem"
version = "1.0.0"
displayName = "Create: Every Key a Gem"
authors = "Gustav-800"
logoFile = "icon.png"
description = '''A client-side keyguard for the Create: Aeronautics wireless redstone typewriter. While the typewriter is in use, mapped shortcut keys are delivered to the typewriter before vanilla or any other mod can process them, so they no longer trigger other mods' actions.'''

[[mixins]]
config = "every_key_a_gem.mixins.json"

